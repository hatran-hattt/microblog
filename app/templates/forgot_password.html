{% extends "layout.html" %} {% block content %}

<h2>Forgot Password</h2>
<form action="" method="post" novalidate>
  {{form.hidden_tag()}}
  <div>
    {{ form.email.label}}<br />
    {{ form.email(size=30) }}<br />
    {% for error in form.email.errors %}
    <span class="error-message">[{{ error }}]</span>
    {% endfor %}
  </div>
  <div>{{ form.submit() }}</div>
</form>

{% endblock %}
